<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Randonnée du Cercle</title>
  <style>
    html, body { margin: 0; background: #000; }
    body { display: grid; place-items: center; min-height: 100vh; }
    canvas { display: block; width: auto; height: 100vh; max-width: 100vw; }
    body.render canvas { width: 1080px; height: 1920px; }
    #scrub { position: fixed; left: 12px; right: 12px; bottom: 12px; }
    body.render #scrub { display: none; }
  </style>
</head>
<body>
  <canvas id="c" width="1080" height="1920"></canvas>
  <input id="scrub" type="range" min="0" max="22.5" step="0.0166667" value="0">
  <script type="module" src="./main.js"></script>
</body>
</html>
